name: Deploy User & Super Admin Docs

on:
  push:
    branches:
      - mkdocs

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mkdocs branch
        uses: actions/checkout@v4
        with:
          ref: mkdocs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build User Docs
        run: |
          mkdocs build -f documentation/user_docs/mkdocs.yml -d ../../.site/user

      - name: Build Super Admin Docs
        run: |
          mkdocs build -f documentation/super_admin_docs/mkdocs.yml -d ../../.site/super-admin

      - name: Generate Landing Page
        run: |
          python generate_landing.py

      - name: Verify build output
        run: |
          ls -R .site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .site
          publish_branch: gh-pages